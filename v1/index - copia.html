<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun: Misión 1 - Entrenamiento Élite (Versión Final v2.1)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        /* Estilos para que el juego ocupe toda la pantalla sin barras de scroll */
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<script>

/**
 * ============================================================
 * 1. CONFIGURACIÓN Y CONEXIÓN CON FIREBASE
 * ============================================================
 */
const firebaseConfig = {
    apiKey: "AIzaSyDzvJeyrZNUXKWEUyrtzfRrUp7nkaHYArw",
    authDomain: "gun4fun-ranking.firebaseapp.com",
    databaseURL: "https://gun4fun-ranking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gun4fun-ranking",
    storageBucket: "gun4fun-ranking.firebasestorage.app",
    messagingSenderId: "467880695461",
    appId: "1:467880695461:web:9510e2b9871d0eecbf9f4c"
};

// Inicializamos la aplicación de Firebase si no existe una previa
if (!firebase.apps.length) { 
    firebase.initializeApp(firebaseConfig); 
}
const database = firebase.database();

/**
 * ============================================================
 * 2. VARIABLES GLOBALES DE CONTROL Y CONFIGURACIÓN
 * ============================================================
 */
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

// Referencias de objetos de juego
let crosshair;
let targets;
let bullets;
let playerGun;
let score = 0;
let scoreText;
let timerText;
let joystickBase;
let joystickKnob;
let fireButton;
let fireText;

// Controladores de estado
let joystickPointer = null;
let timeLeft = 60;
let isGameOver = false;
let spawnEvent;
let timerEvent;

// Referencias de Audio
let bgMusic;
let dianaSound;
let droneSound;
let shotSound;

// Parámetros de Gameplay (Balanceo)
const CROSSHAIR_SPEED = 24; 
const BULLET_SPEED = 2300;
const JOY_X = 180;
const JOY_Y = window.innerHeight - 150;
const JOY_SIZE = 90;

/**
 * ============================================================
 * 3. INICIALIZACIÓN DEL MOTOR PHASER
 * ============================================================
 */
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { 
        default: 'arcade', 
        arcade: { debug: false } 
    },
    input: { activePointers: 3 },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

/**
 * ============================================================
 * 4. PRECARGA DE RECURSOS (CARGA DESDE GITHUB ASSETS)
 * ============================================================
 */
function preload() {
    const repoPath = 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/';
    
    // Carga de archivos de imagen
    this.load.image('fondo', repoPath + 'fondo_campo_de_tiro.jpg');
    this.load.image('mira', repoPath + 'mira_nueva.png'); 
    this.load.image('arma_fija', repoPath + 'arma_player.png'); 
    
    // Carga de Spritesheets (Dianas y Drones con animaciones/frames)
    this.load.spritesheet('diana', repoPath + 'diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone', repoPath + 'drone.png', { frameWidth: 320, frameHeight: 270 });
    
    // Carga de Sonidos descargados por el usuario
    this.load.audio('sfx_disparo', repoPath + 'disparo.mp3');
    this.load.audio('sfx_diana', repoPath + 'diana_impacto.mp3');
    this.load.audio('sfx_drone', repoPath + 'drone_explosion.mp3');
    this.load.audio('musica_fondo', repoPath + 'musica_fondo.mp3');
}

/**
 * ============================================================
 * 5. CREACIÓN DE LA ESCENA Y ELEMENTOS VISUALES
 * ============================================================
 */
function create() {
    // Inicialización de variables por si se reinicia la escena
    isGameOver = false; 
    score = 0; 
    timeLeft = 60;

    // Configuración de los audios en la escena
    bgMusic = this.sound.add('musica_fondo', { volume: 0.3, loop: true });
    shotSound = this.sound.add('sfx_disparo', { volume: 0.45 });
    dianaSound = this.sound.add('sfx_diana', { volume: 0.55 });
    droneSound = this.sound.add('sfx_drone', { volume: 0.7 });

    // FIX: El audio de fondo solo arranca tras el primer click del usuario
    this.input.once('pointerdown', () => {
        if (!bgMusic.isPlaying) {
            bgMusic.play();
        }
    });

    // Colocación del fondo de pantalla
    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo');
    bg.setScale(Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height));

    // Grupos de colisiones físicas
    targets = this.physics.add.group();
    bullets = this.physics.add.group();

    // Mira invisible para guiar el apuntado mecánico
    crosshair = this.physics.add.image(window.innerWidth/2, window.innerHeight/2, 'mira');
    crosshair.setScale(0.25).setVisible(false);
    crosshair.body.setCollideWorldBounds(true);

    // ARMA: Posicionada hundida en la parte inferior para que solo se vea el cañón
    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight + 100, 'arma_fija');
    playerGun.setOrigin(0.5, 1); 
    playerGun.setDepth(11);
    playerGun.setScale(1.1); 
    playerGun.setRotation(0);

    // Interfaz de Usuario: Puntos
    scoreText = this.add.text(30, 30, `PUNTOS: 0`, { 
        fontSize: '32px', fill: '#0f0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 
    }).setDepth(100);
    
    // Interfaz de Usuario: Temporizador
    timerText = this.add.text(window.innerWidth-30, 30, `60s`, { 
        fontSize: '32px', fill: '#ff0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 
    }).setOrigin(1,0).setDepth(100);

    // Joystick: Base visual
    joystickBase = this.add.circle(JOY_X, JOY_Y, JOY_SIZE, 0xffffff, 0.2).setDepth(100);
    // Joystick: Botón móvil (Knob)
    joystickKnob = this.add.circle(JOY_X, JOY_Y, 45, 0x00ff00, 0.8).setDepth(101);
    
    // Botón de Disparo: FIRE
    fireButton = this.add.circle(window.innerWidth-150, JOY_Y, 85, 0xff0000, 0.6).setDepth(100).setInteractive();
    fireText = this.add.text(window.innerWidth-150, JOY_Y, 'FIRE', {
        fontSize:'32px', fill:'#fff', fontStyle:'bold'
    }).setOrigin(0.5).setDepth(101);

    /**
     * GESTIÓN DE ENTRADA TÁCTIL (MULTITOUCH)
     */
    this.input.on('pointerdown', function(pointer) {
        if (isGameOver) return;
        
        // Si tocamos en la parte izquierda, manejamos el joystick
        if (pointer.x < window.innerWidth / 2) {
            let d = Phaser.Math.Distance.Between(pointer.x, pointer.y, JOY_X, JOY_Y);
            if (d <= JOY_SIZE * 2.5) {
                joystickPointer = pointer;
            }
        } 
        // Si tocamos en la parte derecha, comprobamos el botón de disparo
        else {
            let d = Phaser.Math.Distance.Between(pointer.x, pointer.y, fireButton.x, fireButton.y);
            if (d <= 100) {
                disparar.call(this);
            }
        }
    }, this);

    // Detector de colisión entre balas y objetivos
    this.physics.add.overlap(bullets, targets, impactar, null, this);
    
    // Generador automático de objetivos cada 1.2 segundos
    spawnEvent = this.time.addEvent({ 
        delay: 1200, 
        callback: spawnTarget, 
        callbackScope: this, 
        loop: true 
    });
    
    // Reloj de cuenta atrás
    timerEvent = this.time.addEvent({ 
        delay: 1000, 
        callback: () => { 
            if(timeLeft > 0) { 
                timeLeft--; 
                timerText.setText(timeLeft+'s'); 
            } else if(!isGameOver) {
                finalizarMision(this);
            }
        }, 
        loop: true 
    });
}

/**
 * ============================================================
 * 6. BUCLE DE ACTUALIZACIÓN (CADA FRAME)
 * ============================================================
 */
function update() {
    if(isGameOver) return;

    // LÓGICA DE JOYSTICK: Bloqueada estrictamente en el eje horizontal (X)
    if(joystickPointer && joystickPointer.isDown) {
        let deltaX = joystickPointer.x - JOY_X;
        // Limitamos el movimiento del botón dentro de la base blanca
        let limitedX = Math.max(Math.min(deltaX, JOY_SIZE), -JOY_SIZE);
        
        joystickKnob.x = JOY_X + limitedX;
        joystickKnob.y = JOY_Y; // Bloqueo total de la altura del joystick

        // Aplicamos velocidad a la mira invisible basada en el joystick
        crosshair.body.setVelocityX(limitedX * CROSSHAIR_SPEED);
        crosshair.body.setVelocityY(0); 
    } else { 
        // Si no hay toque, centramos el joystick y detenemos la mira
        joystickKnob.setPosition(JOY_X, JOY_Y); 
        crosshair.body.setVelocity(0); 
        joystickPointer = null;
    }
    
    // LÓGICA DE ROTACIÓN: El arma sigue a la mira invisible
    // Usamos un punto muy alto (playerGun.y - 1200) para evitar que rote hacia arriba/abajo
    let targetAngle = Phaser.Math.Angle.Between(
        playerGun.x, 
        playerGun.y, 
        crosshair.x, 
        playerGun.y - 1200 
    );
    
    // Aplicamos la rotación con compensación de 90 grados
    playerGun.rotation = targetAngle + Math.PI / 2;

    // Topes de seguridad para que el arma no gire más de la cuenta
    if (playerGun.rotation < -1.4) playerGun.rotation = -1.4;
    if (playerGun.rotation > 1.4) playerGun.rotation = 1.4;
}

/**
 * ============================================================
 * 7. SPAWN DE OBJETIVOS (DRONES Y DIANAS 10M+)
 * ============================================================
 */
function spawnTarget() {
    if (isGameOver) return;
    
    let rand = Math.random();
    let x, y, target;

    if (rand > 0.5) { 
        // COMPORTAMIENTO DRONE: Movimiento lateral por el aire
        let side = Math.random() > 0.5 ? -80 : window.innerWidth + 80;
        x = side;
        y = Phaser.Math.Between(100, window.innerHeight * 0.4);
        target = targets.create(x, y, 'drone').setDepth(5).setScale(0.5);
        target.tipo = 'drone';
        
        let destX = side < 0 ? window.innerWidth + 150 : -150;
        this.tweens.add({
            targets: target,
            x: destX,
            y: target.y + Phaser.Math.Between(-50, 50),
            duration: Phaser.Math.Between(3000, 5000),
            onComplete: () => { if(target.active) target.destroy(); }
        });
    } else { 
        // COMPORTAMIENTO DIANA: Aparece en el suelo a partir de los 10 metros
        // Restringimos X para que no se salga del camino de tierra central
        x = Phaser.Math.Between(window.innerWidth * 0.25, window.innerWidth * 0.75);
        
        // Restringimos Y para que aparezca después de la línea de los 10m (según foto)
        // La zona segura de tierra está entre el 45% y el 68% de la pantalla
        y = Phaser.Math.Between(window.innerHeight * 0.45, window.innerHeight * 0.68);
        
        target = targets.create(x, y, 'diana').setDepth(5).setScale(0.5).setAlpha(0);
        target.tipo = 'diana';
        
        // Aparece con un fundido y luego se esconde si no le dan
        this.tweens.add({ targets: target, alpha: 1, duration: 400 });
        this.time.delayedCall(2000, () => {
            if (target && target.active) {
                this.tweens.add({ 
                    targets: target, 
                    y: target.y + 150, 
                    alpha: 0, 
                    duration: 600, 
                    onComplete: () => target.destroy() 
                });
            }
        });
    }
    target.setFrame(0);
}

/**
 * ============================================================
 * 8. DISPARO Y SALIDA DE BALA DESDE CAÑÓN
 * ============================================================
 */
function disparar() {
    shotSound.play();
    
    // Pequeño efecto visual de retroceso
    this.tweens.add({ targets: playerGun, y: playerGun.y + 15, duration: 50, yoyo: true });
    
    // CÁLCULO DE LA PUNTA DEL CAÑÓN:
    // Al estar el arma hundida, usamos un largo de cañón de 320px (valor ajustado para final de imagen)
    let largoDelCañon = 320; 
    let muzzleX = playerGun.x + Math.cos(playerGun.rotation - Math.PI/2) * largoDelCañon;
    let muzzleY = playerGun.y + Math.sin(playerGun.rotation - Math.PI/2) * largoDelCañon;

    // Creamos el proyectil (un rectángulo amarillo pequeño)
    let bullet = this.add.rectangle(muzzleX, muzzleY, 8, 30, 0xffff00);
    bullets.add(bullet); 
    this.physics.add.existing(bullet);
    
    // Calculamos trayectoria hacia la mira invisible
    let bulletAngle = Phaser.Math.Angle.Between(bullet.x, bullet.y, crosshair.x, crosshair.y);
    this.physics.velocityFromRotation(bulletAngle, BULLET_SPEED, bullet.body.velocity);
    bullet.rotation = bulletAngle + Math.PI/2;
}

/**
 * ============================================================
 * 9. GESTIÓN DE IMPACTOS
 * ============================================================
 */
function impactar(bullet, target) {
    bullet.destroy(); 
    target.setFrame(1); // Cambia al frame de "roto/explotado"
    target.body.enable = false;
    this.tweens.killTweensOf(target);
    
    // Reproducir sonido según el tipo de objetivo
    if(target.tipo === 'drone') {
        droneSound.play();
        score += 25;
    } else {
        dianaSound.play();
        score += 10;
    }
    
    scoreText.setText(`PUNTOS: ${score}`);
    
    // El objeto desaparece después de una fracción de segundo para ver el frame roto
    this.time.delayedCall(400, () => { 
        if(target.active) target.destroy(); 
    });
}

/**
 * ============================================================
 * 10. FINALIZACIÓN Y RANKING FIREBASE
 * ============================================================
 */
async function finalizarMision(scene) {
    isGameOver = true;
    spawnEvent.remove();
    bgMusic.stop(); // Paramos la música al terminar
    
    // Limpiamos los controles de la pantalla
    joystickBase.setVisible(false); 
    joystickKnob.setVisible(false); 
    fireButton.setVisible(false); 
    fireText.setVisible(false);
    
    // Dibujamos el panel de resultados
    const pW = window.innerWidth * 0.75, pH = window.innerHeight * 0.75;
    const pX = (window.innerWidth - pW) / 2, pY = (window.innerHeight - pH) / 2;
    
    let panel = scene.add.graphics();
    panel.fillStyle(0x000, 0.9);
    panel.fillRoundedRect(pX, pY, pW, pH, 30);
    panel.setDepth(200);
    
    let infoTxt = scene.add.text(window.innerWidth/2, window.innerHeight/2, 'CONECTANDO CON EL CUARTEL...', {
        fontSize:'24px', fill:'#0f0'
    }).setOrigin(0.5).setDepth(201);

    try {
        // Guardamos los datos del jugador actual
        const rankingRef = database.ref('ranking_mision1');
        await rankingRef.push().set({ nombre: userName, puntuacion: score });
        
        // Consultamos los 5 mejores puntuaciones históricos
        rankingRef.orderByChild('puntuacion').limitToLast(5).once('value', (snapshot) => {
            infoTxt.destroy();
            
            scene.add.text(window.innerWidth/2, pY + 60, 'TOP 5 TIRADORES', {
                fontSize:'42px', fill:'#0f0', fontStyle:'bold'
            }).setOrigin(0.5).setDepth(201);
            
            let rankingData = [];
            snapshot.forEach(child => { rankingData.push(child.val()); });
            
            // Los mostramos en orden descendente
            rankingData.reverse().forEach((entry, idx) => {
                let isCurrentPlayer = (entry.nombre === userName && entry.puntuacion === score);
                scene.add.text(window.innerWidth/2, pY + 160 + (idx * 55), 
                    `${idx + 1}. ${entry.nombre.toUpperCase()} - ${entry.puntuacion} PTS`, 
                    { fontSize:'28px', fill: isCurrentPlayer ? '#0f0' : '#fff', fontStyle: isCurrentPlayer ? 'bold' : 'normal' }
                ).setOrigin(0.5).setDepth(201);
            });

            // Botón para volver a jugar
            let restartBtn = scene.add.rectangle(window.innerWidth/2, pY + pH - 80, 320, 90, 0x00ff00).setDepth(201).setInteractive();
            scene.add.text(window.innerWidth/2, pY + pH - 80, 'NUEVO INTENTO', {
                fontSize:'32px', fill:'#000', fontStyle:'bold'
            }).setOrigin(0.5).setDepth(202);
            
            restartBtn.on('pointerdown', () => { scene.scene.restart(); });
        });
    } catch (error) {
        infoTxt.setText("ERROR DE CONEXIÓN CON FIREBASE");
    }
}
</script>
</body>
</html>
