<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun: Misión 1 - Entrenamiento Élite</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>

/**
 * CONFIGURACIÓN FIREBASE (DATOS REALES)
 */
const firebaseConfig = {
    apiKey: "AIzaSyDzvJeyrZNUXKWEUyrtzfRrUp7nkaHYArw",
    authDomain: "gun4fun-ranking.firebaseapp.com",
    databaseURL: "https://gun4fun-ranking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gun4fun-ranking",
    storageBucket: "gun4fun-ranking.firebasestorage.app",
    messagingSenderId: "467880695461",
    appId: "1:467880695461:web:9510e2b9871d0eecbf9f4c"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

/**
 * CONFIGURACIÓN JUEGO
 */
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    input: { activePointers: 3 },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let crosshair, targets, score = 0, scoreText, bullets, playerGun;
let joystickBase, joystickKnob, fireButton, fireText;
let joystickPointer = null;
let timeLeft = 60;
let isGameOver = false;
let spawnEvent, timerEvent;

const CROSSHAIR_SPEED = 18;
const BULLET_SPEED = 2000;
const JOY_X = 180;
const JOY_Y = window.innerHeight - 200;
const JOY_SIZE = 90;

function preload() {
    const repoPath = 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/';
    this.load.image('fondo', repoPath + 'fondo_campo_de_tiro.jpg');
    this.load.image('mira', repoPath + 'mira_nueva.png'); 
    this.load.spritesheet('arma', repoPath + 'arma_player.png', { frameWidth: 256, frameHeight: 320 });
    this.load.spritesheet('diana', repoPath + 'diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone', repoPath + 'drone.png', { frameWidth: 320, frameHeight: 270 });
}

function create() {
    isGameOver = false; score = 0; timeLeft = 60;

    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo');
    bg.setScale(Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height));

    targets = this.physics.add.group();
    bullets = this.physics.add.group();

    crosshair = this.physics.add.image(window.innerWidth/2, window.innerHeight/2, 'mira').setScale(0.25).setDepth(50);
    crosshair.body.setCollideWorldBounds(true);

    playerGun = this.add.sprite(window.innerWidth/2, window.innerHeight, 'arma').setOrigin(0.5, 1).setDepth(10).setScale(0.9);

    scoreText = this.add.text(30, 30, `PUNTOS: 0`, { fontSize: '28px', fill: '#0f0', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 });
    timerText = this.add.text(window.innerWidth-30, 30, `60s`, { fontSize: '28px', fill: '#ff0', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(1,0);

    // Controles
    joystickBase = this.add.circle(JOY_X, JOY_Y, JOY_SIZE, 0xffffff, 0.2).setDepth(100).setInteractive();
    joystickKnob = this.add.circle(JOY_X, JOY_Y, 45, 0x00ff00, 0.8).setDepth(101).setInteractive();
    this.input.on('pointerdown', (p) => { if(!isGameOver && Phaser.Math.Distance.Between(p.x, p.y, JOY_X, JOY_Y) <= JOY_SIZE) joystickPointer = p; });

    fireButton = this.add.circle(window.innerWidth-150, JOY_Y, 85, 0xff0000, 0.6).setDepth(100).setInteractive();
    fireText = this.add.text(window.innerWidth-150, JOY_Y, 'FIRE', {fontSize:'32px', fill:'#fff', fontStyle:'bold'}).setOrigin(0.5).setDepth(101);
    fireButton.on('pointerdown', () => { if(!isGameOver) disparar.call(this); });

    this.physics.add.overlap(bullets, targets, impactar, null, this);
    
    // Generadores con la lógica de movimiento aleatorio y zonas restringidas
    spawnEvent = this.time.addEvent({ delay: 1200, callback: spawnTarget, callbackScope: this, loop: true });
    
    timerEvent = this.time.addEvent({ delay: 1000, callback: () => { 
        if(timeLeft > 0) { timeLeft--; timerText.setText(timeLeft+'s'); } 
        else if(!isGameOver) finalizarMision(this);
    }, loop: true });
}

function update() {
    if(isGameOver) return;
    if(joystickPointer && joystickPointer.isDown) {
        let dist = Phaser.Math.Distance.Between(JOY_X, JOY_Y, joystickPointer.x, joystickPointer.y);
        let angle = Phaser.Math.Angle.Between(JOY_X, JOY_Y, joystickPointer.x, joystickPointer.y);
        joystickKnob.x = JOY_X + Math.cos(angle) * Math.min(dist, JOY_SIZE);
        joystickKnob.y = JOY_Y + Math.sin(angle) * Math.min(dist, JOY_SIZE);
        crosshair.body.setVelocity((joystickKnob.x - JOY_X) * CROSSHAIR_SPEED, (joystickKnob.y - JOY_Y) * CROSSHAIR_SPEED);
    } else { joystickKnob.setPosition(JOY_X, JOY_Y); crosshair.body.setVelocity(0); }
    
    let angle = Phaser.Math.Angle.Between(playerGun.x, playerGun.y, crosshair.x, crosshair.y);
    let deg = Phaser.Math.RadToDeg(angle);
    if(deg < -140) playerGun.setFrame(0); else if(deg < -110) playerGun.setFrame(1); else if(deg < -70) playerGun.setFrame(2); else if(deg < -40) playerGun.setFrame(3); else playerGun.setFrame(4);
}

function spawnTarget() {
    if (isGameOver) return;
    let rand = Math.random();
    let x, y, t;

    if (rand > 0.5) { // DRONES: Movimiento lateral
        let side = Math.random() > 0.5 ? -50 : window.innerWidth + 50;
        x = side;
        y = Phaser.Math.Between(80, window.innerHeight / 2 - 100);
        t = targets.create(x, y, 'drone').setDepth(5).setScale(0.4);
        t.tipo = 'drone';
        let targetX = side < 0 ? window.innerWidth + 100 : -100;
        this.tweens.add({
            targets: t,
            x: targetX,
            y: t.y + Phaser.Math.Between(-50, 50),
            duration: Phaser.Math.Between(3000, 5000),
            onComplete: () => { if(t.active) t.destroy(); }
        });
    } else { // DIANAS: Zona central de tierra
        x = Phaser.Math.Between(200, window.innerWidth - 200);
        y = Phaser.Math.Between(window.innerHeight / 2 + 50, window.innerHeight - 350);
        t = targets.create(x, y, 'diana').setDepth(5).setScale(0.5).setAlpha(0);
        t.tipo = 'diana';
        this.tweens.add({ targets: t, alpha: 1, duration: 300 });
        this.time.delayedCall(2000, () => {
            if (t && t.active) {
                this.tweens.add({ targets: t, y: t.y + 100, alpha: 0, duration: 500, onComplete: () => t.destroy() });
            }
        });
    }
    t.setFrame(0);
}

function disparar() {
    this.tweens.add({ targets: playerGun, y: window.innerHeight+20, duration: 50, yoyo: true });
    let b = this.add.rectangle(playerGun.x, playerGun.y-150, 8, 25, 0xffff00);
    bullets.add(b); this.physics.add.existing(b);
    let a = Phaser.Math.Angle.Between(b.x, b.y, crosshair.x, crosshair.y);
    this.physics.velocityFromRotation(a, BULLET_SPEED, b.body.velocity);
    b.rotation = a + Math.PI/2;
}

function impactar(b, t) {
    b.destroy(); 
    t.setFrame(1); 
    t.body.enable = false;
    this.tweens.killTweensOf(t);
    score += (t.tipo === 'drone') ? 25 : 10;
    scoreText.setText(`PUNTOS: ${score}`);
    this.time.delayedCall(400, () => { if(t.active) t.destroy(); });
}

async function finalizarMision(scene) {
    isGameOver = true;
    spawnEvent.remove();
    joystickBase.setVisible(false); joystickKnob.setVisible(false); fireButton.setVisible(false); fireText.setVisible(false);
    
    scene.add.graphics().fillStyle(0x000, 0.85).fillRect(0,0,window.innerWidth, window.innerHeight).setDepth(200);
    let msg = scene.add.text(window.innerWidth/2, window.innerHeight/2, 'CONECTANDO AL CUARTEL...', {fontSize:'24px', fill:'#0f0'}).setOrigin(0.5).setDepth(201);

    try {
        const ref = database.ref('ranking_mision1');
        await ref.push().set({ nombre: userName, puntuacion: score });

        ref.orderByChild('puntuacion').limitToLast(5).once('value', (snap) => {
            msg.destroy();
            scene.add.text(window.innerWidth/2, 80, 'TOP 5 RECLUTAS', {fontSize:'45px', fill:'#0f0', fontStyle:'bold'}).setOrigin(0.5).setDepth(201);
            
            let records = [];
            snap.forEach(child => { records.push(child.val()); });
            records.reverse().forEach((p, i) => {
                let color = (p.nombre === userName && p.puntuacion === score) ? '#0f0' : '#fff';
                scene.add.text(window.innerWidth/2, 180 + (i*50), `${i+1}. ${p.nombre.toUpperCase()} - ${p.puntuacion} PTS`, {fontSize:'24px', fill: color}).setOrigin(0.5).setDepth(201);
            });

            let btn = scene.add.rectangle(window.innerWidth/2, window.innerHeight-80, 250, 60, 0x0f0).setDepth(201).setInteractive();
            scene.add.text(window.innerWidth/2, window.innerHeight-80, 'REINTENTAR', {fontSize:'24px', fill:'#000', fontStyle:'bold'}).setOrigin(0.5).setDepth(202);
            btn.on('pointerdown', () => scene.scene.restart());
        });
    } catch (e) {
        msg.setText("ERROR DE CONEXIÓN");
    }
}
</script>
</body>
</html>
