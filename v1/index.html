<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun Misión 1: Zonas y Daño</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #2a1a1a; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>

const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let crosshair, targets, score = 0, scoreText;
let ammo = 7, ammoText, isReloading = false;
let playerGun; 

const RELOAD_TIME = 1000; 
const TARGET_SPAWN_RATE = 1500; 
const CONTROL_PANEL_HEIGHT = 180;

function preload() {
    const repoPath = 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/';

    this.load.image('fondo_entrenamiento', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/fondo_campo_de_tiro.jpg');
    this.load.image('mira', 'https://cdn-icons-png.flaticon.com/512/25/25360.png'); 
    
    // Spritesheets (Asegúrate de que diana.png y drone.png estén en assets)
    this.load.spritesheet('arma_player', 'assets/arma_player.png', { frameWidth: 256, frameHeight: 320 });
    this.load.spritesheet('diana_grunt', 'assets/diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone_target', 'assets/drone.png', { frameWidth: 320, frameHeight: 270 });

    this.load.audio('sfx_disparo', repoPath + 'disparo.mp3');
}

function create() {
    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo_entrenamiento');
    let scale = Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height);
    bg.setScale(scale).setScrollFactor(0);

    targets = this.physics.add.group();

    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight, 'arma_player');
    playerGun.setOrigin(0.5, 1).setDepth(100);

    const panelUI = this.add.graphics().setDepth(90);
    panelUI.fillStyle(0x222222, 0.8).fillRect(0, window.innerHeight - CONTROL_PANEL_HEIGHT, window.innerWidth, CONTROL_PANEL_HEIGHT);
    
    scoreText = this.add.text(20, 20, `${userName.toUpperCase()}: ${score}`, { fontSize: '24px', fill: '#fff' }).setDepth(91);
    ammoText = this.add.text(window.innerWidth - 20, 20, `MUNICIÓN: 7/7`, { fontSize: '24px', fill: '#ffff00' }).setOrigin(1, 0).setDepth(91);

    crosshair = this.physics.add.sprite(window.innerWidth/2, window.innerHeight/2, 'mira').setScale(0.1).setDepth(101);

    // NUEVO SISTEMA DE DISPARO: Más directo
    this.input.on('pointerdown', (p) => {
        if (p.y < window.innerHeight - CONTROL_PANEL_HEIGHT) {
            disparar.call(this);
        }
    });

    this.input.on('pointermove', (p) => {
        crosshair.setPosition(p.x, p.y);
    });

    this.input.on('pointerup', (p) => {
        if (p.y - p.downY > 80 && !isReloading) recargar.call(this);
    });

    this.time.addEvent({ delay: TARGET_SPAWN_RATE, callback: spawnTarget, callbackScope: this, loop: true });
}

function spawnTarget() {
    const x = Phaser.Math.Between(150, window.innerWidth - 150);
    let y, tipo;
    
    let rand = Math.random();
    
    // ZONIFICACIÓN LÓGICA
    if (rand > 0.5) {
        tipo = 'drone_target';
        // Solo en el CIELO (De arriba hasta la mitad)
        y = Phaser.Math.Between(100, window.innerHeight / 2 - 50);
    } else {
        tipo = 'diana_grunt';
        // Solo en la TIERRA (De la mitad hasta el panel de control)
        y = Phaser.Math.Between(window.innerHeight / 2 + 50, window.innerHeight - CONTROL_PANEL_HEIGHT - 100);
    }

    let t = targets.create(x, y, tipo).setDepth(10);
    t.tipo = tipo;
    t.setFrame(0);
    t.setScale(tipo === 'drone_target' ? 0.35 : 0.45);

    t.alpha = 0;
    this.tweens.add({ targets: t, alpha: 1, duration: 250 });
    
    // Tiempo de vida en pantalla
    this.time.delayedCall(2000, () => { if (t && t.active) t.destroy(); });
}

function disparar() {
    if (ammo <= 0 || isReloading) return;
    
    ammo--;
    actualizarInterfaz();
    
    // Efecto visual de retroceso del arma
    this.tweens.add({ targets: playerGun, y: window.innerHeight + 20, duration: 50, yoyo: true });
    
    try { this.sound.play('sfx_disparo', { volume: 0.5 }); } catch(e) {}

    let hitSomething = false;

    targets.children.each(t => {
        if (t.active && Phaser.Geom.Intersects.RectangleToRectangle(crosshair.getBounds(), t.getBounds())) {
            hitSomething = true;
            score += (t.tipo === 'drone_target') ? 25 : 10;
            
            // MOSTRAR DAÑO: Cambiamos frame y esperamos más tiempo (300ms)
            t.setFrame(1);
            t.body.enable = false; // Deshabilitar para que no se pueda dar dos veces
            
            this.time.delayedCall(300, () => { 
                if (t.active) {
                    this.tweens.add({ targets: t, alpha: 0, scale: 0, duration: 100, onComplete: () => t.destroy() });
                }
            });
            actualizarInterfaz();
        }
    });

    if (!hitSomething) {
        // Opcional: Pequeño flash o sonido de fallo
    }
}

function recargar() {
    isReloading = true;
    ammoText.setText("RECARGANDO...");
    this.time.delayedCall(RELOAD_TIME, () => {
        ammo = 7;
        isReloading = false;
        actualizarInterfaz();
    });
}

function actualizarInterfaz() {
    scoreText.setText(`${userName.toUpperCase()}: ${score}`);
    if (!isReloading) ammoText.setText(`MUNICIÓN: ${ammo}/7`);
}

function update() {
    let pointer = this.input.activePointer;
    if (playerGun) {
        let angle = Phaser.Math.Angle.Between(playerGun.x, playerGun.y, pointer.x, pointer.y);
        let deg = Phaser.Math.RadToDeg(angle);

        // Sistema de 5 frames (Solo funcionará cuando subas arma_player.png)
        try {
            if (deg < -140) playerGun.setFrame(0);
            else if (deg < -110) playerGun.setFrame(1);
            else if (deg < -70) playerGun.setFrame(2);
            else if (deg < -40) playerGun.setFrame(3);
            else playerGun.setFrame(4);
        } catch(e) {}
    }
}
</script>
</body>
</html>
