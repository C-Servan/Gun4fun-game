<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun Misión 1: Campo de Entrenamiento (TEST)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #2a1a1a; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>

/**
 * CONFIGURACIÓN Y VARIABLES
 */
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let crosshair, targets, score = 0, scoreText;
let ammo = 7, ammoText, isReloading = false;
let playerGun; 

const RELOAD_TIME = 1000; 
const TARGET_SPAWN_RATE = 1500; 
const CONTROL_PANEL_HEIGHT = 180;

/**
 * PRELOAD - USANDO IMÁGENES EXTERNAS DE TEST
 */
function preload() {
    // Fondo y elementos básicos
    this.load.image('fondo_entrenamiento', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/b7714c20dec6d2fd163d80c4d8b031cb9bc12467/assets/fondo_campo_de_tiro.jpg');
    this.load.image('mira', 'https://labs.phaser.io/assets/sprites/crosshair.png'); 
    this.load.image('sargento', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/sargento_pixel.png');
    
    // Diana de Test (Spritesheet horizontal: 2 frames)
    this.load.spritesheet('diana_grunt', 'https://labs.phaser.io/assets/sprites/metalslug_monster3.png', { frameWidth: 42, frameHeight: 38 });
    
    // Drone de Test (Spritesheet horizontal: 2 frames)
    this.load.spritesheet('drone_target', 'https://labs.phaser.io/assets/sprites/hummer.png', { frameWidth: 32, frameHeight: 32 });

    // Arma de Test (Usamos una nave como placeholder)
    this.load.spritesheet('arma_player', 'https://labs.phaser.io/assets/sprites/ship.png', { frameWidth: 32, frameHeight: 32 });

    // Audio
    this.load.audio('sfx_disparo', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/disparo.mp3');
}

/**
 * CREATE
 */
function create() {
    // Fondo escalado
    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo_entrenamiento');
    let scale = Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height);
    bg.setScale(scale).setScrollFactor(0).setDepth(0);

    targets = this.physics.add.group();

    // El arma (placeholder externo)
    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight - 50, 'arma_player');
    playerGun.setOrigin(0.5, 1).setDepth(100).setScale(3);

    // UI Panel
    const panelUI = this.add.graphics().setDepth(90);
    panelUI.fillStyle(0x222222, 0.8).fillRect(0, window.innerHeight - CONTROL_PANEL_HEIGHT, window.innerWidth, CONTROL_PANEL_HEIGHT);
    
    scoreText = this.add.text(20, 20, `${userName.toUpperCase()}: 0`, { fontSize: '24px', fill: '#fff', stroke: '#000', strokeThickness: 4 }).setDepth(91);
    ammoText = this.add.text(window.innerWidth - 20, 20, `MUNICIÓN: 7/7`, { fontSize: '24px', fill: '#ffff00', stroke: '#000', strokeThickness: 4 }).setOrigin(1, 0).setDepth(91);

    // Mira
    crosshair = this.physics.add.sprite(window.innerWidth/2, window.innerHeight/2, 'mira').setScale(0.5).setDepth(101);

    // Controles
    this.input.on('pointerdown', (p) => {
        if (p.y < window.innerHeight - CONTROL_PANEL_HEIGHT) disparar.call(this);
    });

    this.input.on('pointermove', (p) => {
        crosshair.x = p.x;
        crosshair.y = p.y;
    });

    this.input.on('pointerup', (p) => {
        if (p.y - p.downY > 100 && !isReloading) recargar.call(this);
    });

    // Spawn automático
    this.time.addEvent({ delay: TARGET_SPAWN_RATE, callback: spawnTarget, callbackScope: this, loop: true });
}

function spawnTarget() {
    const x = Phaser.Math.Between(100, window.innerWidth - 100);
    const y = Phaser.Math.Between(150, window.innerHeight - CONTROL_PANEL_HEIGHT - 150);
    
    let rand = Math.random();
    let tipo = rand > 0.9 ? 'sargento' : (rand > 0.6 ? 'drone_target' : 'diana_grunt');

    let t = targets.create(x, y, tipo).setDepth(10);
    t.tipo = tipo;

    if (tipo !== 'sargento') {
        t.setFrame(0);
        t.setScale(2); // Escala aumentada para que se vean bien los de test
    } else {
        t.setScale(0.6);
    }

    t.alpha = 0;
    this.tweens.add({ targets: t, alpha: 1, duration: 200 });
    this.time.delayedCall(1500, () => { if (t && t.active) t.destroy(); });
}

function disparar() {
    if (ammo <= 0 || isReloading) return;
    ammo--;
    actualizarInterfaz();
    
    this.sound.play('sfx_disparo', { volume: 0.4 });

    targets.children.each(t => {
        if (t.active && Phaser.Geom.Intersects.RectangleToRectangle(crosshair.getBounds(), t.getBounds())) {
            if (t.tipo !== 'sargento') {
                score += (t.tipo === 'drone_target') ? 25 : 10;
                // En el test, el frame 1 es el objeto en otra posición o color
                t.setFrame(1); 
            } else {
                score = Math.max(0, score - 50);
                this.cameras.main.shake(200, 0.02);
            }
            this.time.delayedCall(100, () => { if (t.active) t.destroy(); });
            actualizarInterfaz();
        }
    });
}

function recargar() {
    isReloading = true;
    ammoText.setText("RECARGANDO...");
    this.time.delayedCall(RELOAD_TIME, () => {
        ammo = 7;
        isReloading = false;
        actualizarInterfaz();
    });
}

function actualizarInterfaz() {
    scoreText.setText(`${userName.toUpperCase()}: ${score}`);
    if (!isReloading) ammoText.setText(`MUNICIÓN: ${ammo}/7`);
}

function update() {
    let pointer = this.input.activePointer;
    if (playerGun && (pointer.active || pointer.isDown)) {
        let angle = Phaser.Math.Angle.Between(playerGun.x, playerGun.y, pointer.x, pointer.y);
        playerGun.rotation = angle + Math.PI/2;
    }
}
</script>
</body>
</html>
