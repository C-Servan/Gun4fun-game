<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun: Misión 1 - Entrenamiento Élite</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; user-select: none; }
    </style>
</head>
<body>
<script>

/**
 * 1. CONFIGURACIÓN FIREBASE
 */
const firebaseConfig = {
    apiKey: "AIzaSyDzvJeyrZNUXKWEUyrtzfRrUp7nkaHYArw",
    authDomain: "gun4fun-ranking.firebaseapp.com",
    databaseURL: "https://gun4fun-ranking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gun4fun-ranking",
    storageBucket: "gun4fun-ranking.firebasestorage.app",
    messagingSenderId: "467880695461",
    appId: "1:467880695461:web:9510e2b9871d0eecbf9f4c"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

/**
 * 2. VARIABLES DE ESTADO
 */
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

let crosshair, targets, bullets, playerGun, gunBase;
let score = 0, scoreText, timerText;
let joystickBase, joystickKnob, fireButton, fireText;
let joystickPointer = null;
let timeLeft = 60;
let isGameOver = false;
let spawnEvent, timerEvent;
let bgMusic, dianaSound, droneSound, shotSound;

const CROSSHAIR_SPEED = 22; // Aumentado ligeramente para compensar el eje único
const BULLET_SPEED = 2200;
const JOY_X = 180;
const JOY_Y = window.innerHeight - 150;
const JOY_SIZE = 90;

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    input: { activePointers: 3 },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

/**
 * 3. CARGA DE ACTIVOS
 */
function preload() {
    const repoPath = 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/';
    this.load.image('fondo', repoPath + 'fondo_campo_de_tiro.jpg');
    this.load.image('mira', repoPath + 'mira_nueva.png'); 
    this.load.image('arma_fija', repoPath + 'arma_player.png'); 
    this.load.spritesheet('diana', repoPath + 'diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone', repoPath + 'drone.png', { frameWidth: 320, frameHeight: 270 });
    this.load.audio('sfx_disparo', repoPath + 'disparo.mp3');
    this.load.audio('sfx_diana', repoPath + 'diana_impacto.mp3');
    this.load.audio('sfx_drone', repoPath + 'drone_explosion.mp3');
    this.load.audio('musica_fondo', repoPath + 'musica_fondo.mp3');
}

/**
 * 4. ESCENA DE INICIO
 */
function create() {
    isGameOver = false; score = 0; timeLeft = 60;

    // Sonidos
    bgMusic = this.sound.add('musica_fondo', { volume: 0.3, loop: true });
    shotSound = this.sound.add('sfx_disparo', { volume: 0.45 });
    dianaSound = this.sound.add('sfx_diana', { volume: 0.55 });
    droneSound = this.sound.add('sfx_drone', { volume: 0.7 });

    // Solución al problema del audio: Intentar tocar al primer click
    this.input.once('pointerdown', () => {
        if (!bgMusic.isPlaying) bgMusic.play();
    });

    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo');
    bg.setScale(Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height));

    targets = this.physics.add.group();
    bullets = this.physics.add.group();

    // Mira invisible
    crosshair = this.physics.add.image(window.innerWidth/2, window.innerHeight/2, 'mira');
    crosshair.setScale(0.25).setVisible(false);
    crosshair.body.setCollideWorldBounds(true);

    // ARMA: Posicionada extremadamente baja (Solo se ve la mitad superior)
    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight + 120, 'arma_fija');
    playerGun.setOrigin(0.5, 1).setDepth(11).setScale(1.1); 
    playerGun.setRotation(0);

    scoreText = this.add.text(30, 30, `PUNTOS: 0`, { fontSize: '32px', fill: '#0f0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 });
    timerText = this.add.text(window.innerWidth-30, 30, `60s`, { fontSize: '32px', fill: '#ff0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 }).setOrigin(1,0);

    // Joystick
    joystickBase = this.add.circle(JOY_X, JOY_Y, JOY_SIZE, 0xffffff, 0.2).setDepth(100);
    joystickKnob = this.add.circle(JOY_X, JOY_Y, 45, 0x00ff00, 0.8).setDepth(101);
    
    // Botón FIRE
    fireButton = this.add.circle(window.innerWidth-150, JOY_Y, 85, 0xff0000, 0.6).setDepth(100).setInteractive();
    fireText = this.add.text(window.innerWidth-150, JOY_Y, 'FIRE', {fontSize:'32px', fill:'#fff', fontStyle:'bold'}).setOrigin(0.5).setDepth(101);

    this.input.on('pointerdown', function(pointer) {
        if (isGameOver) return;
        if (pointer.x < window.innerWidth / 2) {
            if (Phaser.Math.Distance.Between(pointer.x, pointer.y, JOY_X, JOY_Y) <= JOY_SIZE * 2.5) { joystickPointer = pointer; }
        } else {
            if (Phaser.Math.Distance.Between(pointer.x, pointer.y, fireButton.x, fireButton.y) <= 100) { disparar.call(this); }
        }
    }, this);

    this.physics.add.overlap(bullets, targets, impactar, null, this);
    spawnEvent = this.time.addEvent({ delay: 1200, callback: spawnTarget, callbackScope: this, loop: true });
    timerEvent = this.time.addEvent({ delay: 1000, callback: () => { 
        if(timeLeft > 0) { timeLeft--; timerText.setText(timeLeft+'s'); } 
        else if(!isGameOver) finalizarMision(this);
    }, loop: true });
}

/**
 * 5. BUCLE ACTUALIZACIÓN
 */
function update() {
    if(isGameOver) return;

    // Lógica JOYSTICK BLOQUEADA en eje X
    if(joystickPointer && joystickPointer.isDown) {
        let deltaX = joystickPointer.x - JOY_X;
        let limitedX = Math.max(Math.min(deltaX, JOY_SIZE), -JOY_SIZE);
        
        joystickKnob.x = JOY_X + limitedX;
        joystickKnob.y = JOY_Y; // Bloqueo total del eje Y

        crosshair.body.setVelocityX(limitedX * CROSSHAIR_SPEED);
        crosshair.body.setVelocityY(0); // Mira no sube ni baja
    } else { 
        joystickKnob.setPosition(JOY_X, JOY_Y); 
        crosshair.body.setVelocity(0); 
        joystickPointer = null;
    }
    
    // Rotación del arma (Solo horizontal)
    let targetAngle = Phaser.Math.Angle.Between(playerGun.x, playerGun.y, crosshair.x, playerGun.y - 1000);
    playerGun.rotation = targetAngle + Math.PI / 2;

    if (playerGun.rotation < -1.4) playerGun.rotation = -1.4;
    if (playerGun.rotation > 1.4) playerGun.rotation = 1.4;
}

/**
 * 6. GENERACIÓN OBJETIVOS
 */
function spawnTarget() {
    if (isGameOver) return;
    let rand = Math.random();
    let x, y, target;

    if (rand > 0.5) { 
        let side = Math.random() > 0.5 ? -80 : window.innerWidth + 80;
        x = side; y = Phaser.Math.Between(120, window.innerHeight / 2 - 50);
        target = targets.create(x, y, 'drone').setDepth(5).setScale(0.5);
        target.tipo = 'drone';
        let destX = side < 0 ? window.innerWidth + 150 : -150;
        this.tweens.add({ targets: target, x: destX, y: target.y + Phaser.Math.Between(-100, 100), duration: Phaser.Math.Between(3000, 5000), onComplete: () => { if(target.active) target.destroy(); } });
    } else { 
        x = Phaser.Math.Between(200, window.innerWidth - 200);
        y = Phaser.Math.Between(window.innerHeight / 2 + 50, window.innerHeight - 300);
        target = targets.create(x, y, 'diana').setDepth(5).setScale(0.6).setAlpha(0);
        target.tipo = 'diana';
        this.tweens.add({ targets: target, alpha: 1, duration: 400 });
        this.time.delayedCall(2000, () => { if (target && target.active) { this.tweens.add({ targets: target, y: target.y + 200, alpha: 0, duration: 600, onComplete: () => target.destroy() }); } });
    }
    target.setFrame(0);
}

/**
 * 7. ACCIÓN DISPARO
 */
function disparar() {
    shotSound.play();
    
    // Retroceso
    this.tweens.add({ targets: playerGun, y: playerGun.y + 15, duration: 50, yoyo: true });
    
    // SALIDA DE BALA DESDE EL CAÑÓN (Parte superior de la imagen rotada)
    // Calculamos el offset basado en la rotación del arma
    let muzzleX = playerGun.x + Math.cos(playerGun.rotation - Math.PI/2) * 50;
    let muzzleY = playerGun.y + Math.sin(playerGun.rotation - Math.PI/2) * 50;

    let bullet = this.add.rectangle(muzzleX, muzzleY, 8, 30, 0xffff00);
    bullets.add(bullet); 
    this.physics.add.existing(bullet);
    
    // La bala viaja hacia la mira (eje X)
    let bulletAngle = Phaser.Math.Angle.Between(bullet.x, bullet.y, crosshair.x, crosshair.y);
    this.physics.velocityFromRotation(bulletAngle, BULLET_SPEED, bullet.body.velocity);
    bullet.rotation = bulletAngle + Math.PI/2;
}

/**
 * 8. COLISIONES
 */
function impactar(bullet, target) {
    bullet.destroy(); 
    target.setFrame(1); 
    target.body.enable = false;
    this.tweens.killTweensOf(target);
    
    if(target.tipo === 'drone') { droneSound.play(); score += 25; } 
    else { dianaSound.play(); score += 10; }
    
    scoreText.setText(`PUNTOS: ${score}`);
    this.time.delayedCall(400, () => { if(target.active) target.destroy(); });
}

/**
 * 9. RANKING Y FINAL
 */
async function finalizarMision(scene) {
    isGameOver = true;
    spawnEvent.remove();
    bgMusic.stop();
    
    joystickBase.setVisible(false); joystickKnob.setVisible(false); fireButton.setVisible(false); fireText.setVisible(false);
    
    const pW = window.innerWidth * 0.7, pH = window.innerHeight * 0.7;
    const pX = (window.innerWidth - pW) / 2, pY = (window.innerHeight - pH) / 2;
    scene.add.graphics().fillStyle(0x000, 0.9).fillRoundedRect(pX, pY, pW, pH, 30).setDepth(200);
    
    let loadTxt = scene.add.text(window.innerWidth/2, window.innerHeight/2, 'CARGANDO CUARTEL...', {fontSize:'24px', fill:'#0f0'}).setOrigin(0.5).setDepth(201);

    try {
        const ref = database.ref('ranking_mision1');
        await ref.push().set({ nombre: userName, puntuacion: score });
        ref.orderByChild('puntuacion').limitToLast(5).once('value', (snap) => {
            loadTxt.destroy();
            scene.add.text(window.innerWidth/2, pY + 50, 'TOP 5 AGENTES', {fontSize:'38px', fill:'#0f0', fontStyle:'bold'}).setOrigin(0.5).setDepth(201);
            let data = [];
            snap.forEach(c => { data.push(c.val()); });
            data.reverse().forEach((r, i) => {
                let isMe = (r.nombre === userName && r.puntuacion === score);
                scene.add.text(window.innerWidth/2, pY + 140 + (i*50), `${i+1}. ${r.nombre.toUpperCase()} - ${r.puntuacion}`, {fontSize:'26px', fill: isMe ? '#0f0' : '#fff'}).setOrigin(0.5).setDepth(201);
            });
            let btn = scene.add.rectangle(window.innerWidth/2, pY + pH - 70, 300, 80, 0x0f0).setDepth(201).setInteractive();
            scene.add.text(window.innerWidth/2, pY + pH - 70, 'REINTENTAR', {fontSize:'28px', fill:'#000', fontStyle:'bold'}).setOrigin(0.5).setDepth(202);
            btn.on('pointerdown', () => scene.scene.restart());
        });
    } catch (e) { loadTxt.setText("ERROR DE CONEXIÓN"); }
}
</script>
</body>
</html>
