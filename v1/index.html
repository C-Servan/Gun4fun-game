<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun Misión 1: Campo de Entrenamiento</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #2a1a1a; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>

/**
 * BLOQUE 1: CONFIGURACIÓN Y VARIABLES
 */
const FIREBASE_DB_URL_M1 = "https://gun4fun-ranking-default-rtdb.europe-west1.firebasedatabase.app/mision1.json"; 
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let crosshair, targets, score = 0, scoreText, missionText;
let ammo = 7, ammoText, isReloading = false;
let bgMusic, sfxDisparo, sfxSargento, sfxAcierto;
let musicStarted = false;
let playerGun; // Variable para el arma

const RELOAD_TIME = 1000; 
const TARGET_SPAWN_RATE = 1500; 
const CONTROL_PANEL_HEIGHT = 180;

/**
 * BLOQUE 2: GESTIÓN DE ACTIVOS
 */
function preload() {
    this.load.image('fondo_entrenamiento', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/b7714c20dec6d2fd163d80c4d8b031cb9bc12467/assets/fondo_campo_de_tiro.jpg');
    this.load.image('mira', 'https://cdn-icons-png.flaticon.com/512/25/25360.png'); 
    this.load.image('sargento', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/sargento_pixel.png');
    
    // Spritesheets con las medidas exactas proporcionadas
    this.load.spritesheet('arma_player', 'assets/arma_player.png', { frameWidth: 256, frameHeight: 320 });
    this.load.spritesheet('diana_grunt', 'assets/diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone_target', 'assets/drone.png', { frameWidth: 320, frameHeight: 270 });

    this.load.audio('musica_m1', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/musica_arcade.mp3');
    this.load.audio('sfx_disparo', 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/disparo.mp3');
}

/**
 * BLOQUE 3: INICIALIZACIÓN
 */
function create() {
    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo_entrenamiento');
    let scaleX = window.innerWidth / bg.width;
    let scaleY = window.innerHeight / bg.height;
    let scale = Math.max(scaleX, scaleY);
    bg.setScale(scale).setScrollFactor(0);

    targets = this.physics.add.group();

    // IMPLEMENTACIÓN DEL ARMA (5 FRAMES)
    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight, 'arma_player');
    playerGun.setOrigin(0.5, 1); 
    playerGun.setDepth(100);
    playerGun.setFrame(2); // Inicia en el centro

    const panelUI = this.add.graphics();
    panelUI.fillStyle(0x222222, 0.8);
    panelUI.fillRect(0, window.innerHeight - CONTROL_PANEL_HEIGHT, window.innerWidth, CONTROL_PANEL_HEIGHT);
    panelUI.lineStyle(4, 0x00ff00, 1);
    panelUI.lineBetween(0, window.innerHeight - CONTROL_PANEL_HEIGHT, window.innerWidth, window.innerHeight - CONTROL_PANEL_HEIGHT);

    this.add.text(window.innerWidth/2, window.innerHeight - (CONTROL_PANEL_HEIGHT / 2) - 20, 'DESLIZA ABAJO PARA RECARGAR', {
        fontSize: '18px', fill: '#00ff00', fontStyle: 'bold', alpha: 0.8
    }).setOrigin(0.5);

    scoreText = this.add.text(20, 20, `${userName.toUpperCase()}: 0`, { fontSize: '24px', fill: '#fff', stroke: '#000', strokeThickness: 4 });
    ammoText = this.add.text(window.innerWidth - 20, 20, `MUNICIÓN: 7/7`, { fontSize: '24px', fill: '#ffff00', stroke: '#000', strokeThickness: 4 }).setOrigin(1, 0);
    missionText = this.add.text(20, 55, 'MISIÓN 1: CAMPO DE ENTRENAMIENTO', { fontSize: '14px', fill: '#00ff00', fontStyle: 'bold' });

    crosshair = this.physics.add.sprite(window.innerWidth/2, window.innerHeight/2, 'mira').setScale(0.1).setDepth(10);

    this.input.on('pointerdown', (p) => {
        if (!musicStarted) { musicStarted = true; }
        if (p.y < window.innerHeight - CONTROL_PANEL_HEIGHT) {
            disparar.call(this);
        }
    });

    this.input.on('pointermove', (p) => {
        crosshair.x = p.x;
        crosshair.y = p.y;
    });

    this.input.on('pointerup', (p) => {
        let swipeDistance = p.y - p.downY;
        if (swipeDistance > 100 && !isReloading) {
            recargar.call(this);
        }
    });

    this.time.addEvent({ delay: TARGET_SPAWN_RATE, callback: spawnTarget, callbackScope: this, loop: true });
}

/**
 * BLOQUE 4: LÓGICA DE JUEGO
 */
function spawnTarget() {
    const x = Phaser.Math.Between(50, window.innerWidth - 50);
    const y = Phaser.Math.Between(100, window.innerHeight - CONTROL_PANEL_HEIGHT - 100);
    
    let rand = Math.random();
    let tipo = rand > 0.9 ? 'sargento' : (rand > 0.6 ? 'drone_target' : 'diana_grunt');
    
    let t = targets.create(x, y, tipo).setScale(0.5);
    t.tipo = tipo;
    if(tipo !== 'sargento') t.setFrame(0);

    t.alpha = 0;
    this.tweens.add({
        targets: t,
        alpha: 1,
        duration: 200,
        onComplete: () => {
            this.time.delayedCall(1200, () => {
                if (t.active) t.destroy();
            });
        }
    });
}

function disparar() {
    if (ammo <= 0 || isReloading) return;

    ammo--;
    actualizarInterfaz();
    
    let flash = this.add.circle(crosshair.x, crosshair.y, 20, 0xffff00, 0.5);
    this.time.delayedCall(50, () => flash.destroy());

    targets.children.each(t => {
        if (t.active && Phaser.Geom.Intersects.RectangleToRectangle(crosshair.getBounds(), t.getBounds())) {
            procesarAcierto.call(this, t);
        }
    });
}

function procesarAcierto(target) {
    if (target.tipo === 'sargento') {
        score = Math.max(0, score - 50);
        this.cameras.main.shake(200, 0.02);
    } else {
        score += (target.tipo === 'drone_target') ? 25 : 10;
        target.setFrame(1); // Muestra estado roto
    }
    this.time.delayedCall(100, () => { if (target.active) target.destroy(); });
    actualizarInterfaz();
}

function recargar() {
    isReloading = true;
    ammoText.setText("RECARGANDO...");
    this.time.delayedCall(RELOAD_TIME, () => {
        ammo = 7;
        isReloading = false;
        actualizarInterfaz();
    });
}

function actualizarInterfaz() {
    scoreText.setText(`${userName.toUpperCase()}: ${score}`);
    if (!isReloading) ammoText.setText(`MUNICIÓN: ${ammo}/7`);
}

function update() {
    targets.children.each(c => { if (c.active && (c.y > window.innerHeight || c.y < -100)) c.destroy(); });

    // LÓGICA DE APUNTADO (5 FRAMES)
    let pointer = this.input.activePointer;
    if (pointer.active || pointer.isDown) {
        let angle = Phaser.Math.Angle.Between(playerGun.x, playerGun.y, pointer.x, pointer.y);
        let deg = Phaser.Math.RadToDeg(angle);

        // Sectores para 5 frames (de izquierda -180 a derecha 0)
        if (deg < -140) {
            playerGun.setFrame(0); // Extremo Izquierda
        } else if (deg < -110) {
            playerGun.setFrame(1); // Diagonal Izquierda
        } else if (deg < -70) {
            playerGun.setFrame(2); // Centro
        } else if (deg < -40) {
            playerGun.setFrame(3); // Diagonal Derecha
        } else {
            playerGun.setFrame(4); // Extremo Derecha
        }
    }
}

</script>
</body>
</html>
