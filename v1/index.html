<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gun4Fun: Misión 1 - Entrenamiento Élite (Versión Maestra v2.5)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        /* Eliminamos márgenes y scroll para una inmersión total en móviles y PC */
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<script>

/**
 * ============================================================
 * 1. CONFIGURACIÓN DEL SISTEMA DE RANKING (FIREBASE)
 * ============================================================
 */
const firebaseConfig = {
    apiKey: "AIzaSyDzvJeyrZNUXKWEUyrtzfRrUp7nkaHYArw",
    authDomain: "gun4fun-ranking.firebaseapp.com",
    databaseURL: "https://gun4fun-ranking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "gun4fun-ranking",
    storageBucket: "gun4fun-ranking.firebasestorage.app",
    messagingSenderId: "467880695461",
    appId: "1:467880695461:web:9510e2b9871d0eecbf9f4c"
};

// Inicialización de la base de datos
if (!firebase.apps.length) { 
    firebase.initializeApp(firebaseConfig); 
}
const database = firebase.database();

/**
 * ============================================================
 * 2. VARIABLES DE AMBIENTE Y CONTROL DE JUEGO
 * ============================================================
 */
const urlParams = new URLSearchParams(window.location.search);
const userName = urlParams.get('user') || 'Recluta';

// Objetos de la escena
let crosshair;
let targets;
let bullets;
let playerGun;
let score = 0;
let scoreText;
let timerText;
let joystickBase;
let joystickKnob;
let fireButton;
let fireText;

// Control de físicas y tiempos
let joystickPointer = null;
let timeLeft = 60;
let isGameOver = false;
let spawnEvent;
let timerEvent;

// Almacén de sonidos (SFX)
let bgMusic;
let dianaSound;
let droneSound;
let shotSound;

/**
 * CONSTANTES DE CALIBRACIÓN (GAMEPLAY)
 */
const CROSSHAIR_SPEED = 24; 
const BULLET_SPEED = 2300;
const JOY_X = 180;
const JOY_Y = window.innerHeight - 150;
const JOY_SIZE = 90;

/**
 * ============================================================
 * 3. CONFIGURACIÓN DEL MOTOR PHASER
 * ============================================================
 */
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { 
        default: 'arcade', 
        arcade: { debug: false } 
    },
    input: { activePointers: 3 },
    scene: { 
        preload: preload, 
        create: create, 
        update: update 
    }
};

const game = new Phaser.Game(config);

/**
 * ============================================================
 * 4. FASE DE CARGA (PRELOAD)
 * ============================================================
 */
function preload() {
    const repoPath = 'https://raw.githubusercontent.com/C-Servan/Gun4fun-game/main/assets/';
    
    // Gráficos del campo de tiro
    this.load.image('fondo', repoPath + 'fondo_campo_de_tiro.jpg');
    this.load.image('mira', repoPath + 'mira_nueva.png'); 
    this.load.image('arma_fija', repoPath + 'arma_player.png'); 
    
    // Objetivos animados
    this.load.spritesheet('diana', repoPath + 'diana.png', { frameWidth: 320, frameHeight: 640 });
    this.load.spritesheet('drone', repoPath + 'drone.png', { frameWidth: 320, frameHeight: 270 });
    
    // Librería de audio
    this.load.audio('sfx_disparo', repoPath + 'disparo.mp3');
    this.load.audio('sfx_diana', repoPath + 'diana_impacto.mp3');
    this.load.audio('sfx_drone', repoPath + 'drone_explosion.mp3');
    this.load.audio('musica_fondo', repoPath + 'musica_fondo.mp3');
}

/**
 * ============================================================
 * 5. FASE DE CONSTRUCCIÓN (CREATE)
 * ============================================================
 */
function create() {
    // Reset de estado inicial
    isGameOver = false; 
    score = 0; 
    timeLeft = 60;

    // Inicialización de SFX
    bgMusic = this.sound.add('musica_fondo', { volume: 0.3, loop: true });
    shotSound = this.sound.add('sfx_disparo', { volume: 0.45 });
    dianaSound = this.sound.add('sfx_diana', { volume: 0.55 });
    droneSound = this.sound.add('sfx_drone', { volume: 0.7 });

    // Activación de audio por interacción (Requisito de navegadores)
    this.input.once('pointerdown', () => {
        if (!bgMusic.isPlaying) bgMusic.play();
    });

    // Fondo ajustado a la resolución de pantalla
    let bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'fondo');
    bg.setScale(Math.max(window.innerWidth / bg.width, window.innerHeight / bg.height));

    // Grupos físicos
    targets = this.physics.add.group();
    bullets = this.physics.add.group();

    // Mira telescópica (lógica de apuntado)
    crosshair = this.physics.add.image(window.innerWidth/2, window.innerHeight/2, 'mira');
    crosshair.setScale(0.25).setVisible(false);
    crosshair.body.setCollideWorldBounds(true);

    // ARMA: Hundida en la parte inferior (Solo asoma el cañón)
    playerGun = this.add.sprite(window.innerWidth / 2, window.innerHeight + 100, 'arma_fija');
    playerGun.setOrigin(0.5, 1).setDepth(11).setScale(1.1); 

    // Interfaz de Usuario (HUD)
    scoreText = this.add.text(30, 30, `PUNTOS: 0`, { 
        fontSize: '32px', fill: '#0f0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 
    }).setDepth(100);
    
    timerText = this.add.text(window.innerWidth-30, 30, `60s`, { 
        fontSize: '32px', fill: '#ff0', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 
    }).setOrigin(1,0).setDepth(100);

    // Controles táctiles: JOYSTICK
    joystickBase = this.add.circle(JOY_X, JOY_Y, JOY_SIZE, 0xffffff, 0.2).setDepth(100);
    joystickKnob = this.add.circle(JOY_X, JOY_Y, 45, 0x00ff00, 0.8).setDepth(101);
    
    // Controles táctiles: BOTÓN FIRE
    fireButton = this.add.circle(window.innerWidth-150, JOY_Y, 85, 0xff0000, 0.6).setDepth(100).setInteractive();
    fireText = this.add.text(window.innerWidth-150, JOY_Y, 'FIRE', {
        fontSize:'32px', fill:'#fff', fontStyle:'bold'
    }).setOrigin(0.5).setDepth(101);

    /**
     * GESTIÓN DE ENTRADAS (CLIC Y TOQUE MULTIPLE)
     */
    this.input.on('pointerdown', function(pointer) {
        if (isGameOver) return;
        
        // Zona izquierda: Movimiento
        if (pointer.x < window.innerWidth / 2) {
            let dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, JOY_X, JOY_Y);
            if (dist <= JOY_SIZE * 2.5) {
                joystickPointer = pointer;
            }
        } 
        // Zona derecha: Disparo
        else {
            let distFire = Phaser.Math.Distance.Between(pointer.x, pointer.y, fireButton.x, fireButton.y);
            if (distFire <= 100) {
                disparar.call(this);
            }
        }
    }, this);

    // Colisión Bala - Objetivo
    this.physics.add.overlap(bullets, targets, impactar, null, this);
    
    // Temporizadores de eventos
    spawnEvent = this.time.addEvent({ 
        delay: 1200, 
        callback: spawnTarget, 
        callbackScope: this, 
        loop: true 
    });
    
    timerEvent = this.time.addEvent({ 
        delay: 1000, 
        callback: () => { 
            if(timeLeft > 0) { 
                timeLeft--; 
                timerText.setText(timeLeft+'s'); 
            } else if(!isGameOver) {
                finalizarMision(this);
            }
        }, 
        loop: true 
    });
}

/**
 * ============================================================
 * 6. BUCLE DE ACTUALIZACIÓN (UPDATE)
 * ============================================================
 */
function update() {
    if(isGameOver) return;

    // CONTROL DEL JOYSTICK (Eje X estricto)
    if(joystickPointer && joystickPointer.isDown) {
        let deltaX = joystickPointer.x - JOY_X;
        let limitedX = Math.max(Math.min(deltaX, JOY_SIZE), -JOY_SIZE);
        
        joystickKnob.x = JOY_X + limitedX;
        joystickKnob.y = JOY_Y; // Bloqueo vertical del botón

        // Movimiento de la mira
        crosshair.body.setVelocityX(limitedX * CROSSHAIR_SPEED);
        crosshair.body.setVelocityY(0); 
    } else { 
        joystickKnob.setPosition(JOY_X, JOY_Y); 
        crosshair.body.setVelocity(0); 
        joystickPointer = null;
    }
    
    // ROTACIÓN DEL ARMA (Siguiendo a la mira con eje horizontal)
    let angle = Phaser.Math.Angle.Between(
        playerGun.x, playerGun.y, 
        crosshair.x, playerGun.y - 1200 
    );
    playerGun.rotation = angle + Math.PI / 2;

    // Límites de giro del cañón
    if (playerGun.rotation < -1.4) playerGun.rotation = -1.4;
    if (playerGun.rotation > 1.4) playerGun.rotation = 1.4;
}

/**
 * ============================================================
 * 7. SISTEMA DE GENERACIÓN DE OBJETIVOS (CALIBRADO)
 * ============================================================
 */
function spawnTarget() {
    if (isGameOver) return;
    
    let rand = Math.random();
    let x, y, target;

    // CASO A: DRONES (AIRE)
    if (rand > 0.5) { 
        let side = Math.random() > 0.5 ? -80 : window.innerWidth + 80;
        x = side;
        y = Phaser.Math.Between(50, window.innerHeight * 0.38);
        target = targets.create(x, y, 'drone').setDepth(5).setScale(0.5);
        target.tipo = 'drone';
        
        let destX = side < 0 ? window.innerWidth + 150 : -150;
        this.tweens.add({
            targets: target,
            x: destX,
            y: target.y + Phaser.Math.Between(-50, 50),
            duration: Phaser.Math.Between(3000, 5000),
            onComplete: () => { if(target.active) target.destroy(); }
        });
    } 
    // CASO B: DIANAS (DISTANCIA 10M+)
    else { 
        // Aparecen en el camino de tierra central
        x = Phaser.Math.Between(window.innerWidth * 0.25, window.innerWidth * 0.75);
        
        // CALIBRACIÓN DE DISTANCIA:
        // Límite superior: 0.40 (Más al fondo del escenario)
        // Límite inferior: 0.60 (Lejos de los sacos de arena y del arma)
        y = Phaser.Math.Between(window.innerHeight * 0.40, window.innerHeight * 0.60);
        
        target = targets.create(x, y, 'diana').setDepth(5).setScale(0.5).setAlpha(0);
        target.tipo = 'diana';
        
        // Animación de aparición y desaparición automática
        this.tweens.add({ targets: target, alpha: 1, duration: 400 });
        this.time.delayedCall(2000, () => {
            if (target && target.active) {
                this.tweens.add({ 
                    targets: target, 
                    y: target.y + 150, 
                    alpha: 0, 
                    duration: 600, 
                    onComplete: () => target.destroy() 
                });
            }
        });
    }
    target.setFrame(0);
}

/**
 * ============================================================
 * 8. LÓGICA DE DISPARO (PUNTA DEL CAÑÓN AJUSTADA)
 * ============================================================
 */
function disparar() {
    shotSound.play();
    
    // Retroceso visual
    this.tweens.add({ targets: playerGun, y: playerGun.y + 15, duration: 50, yoyo: true });
    
    /**
     * CÁLCULO DE MUZZLE (SALIDA DE BALA)
     * He subido el valor a 380 para que la bala nazca 2cm más arriba
     * que en la versión anterior, coincidiendo con la punta visual del arma.
     */
    let largoDelCañon = 440; 
    let muzzleX = playerGun.x + Math.cos(playerGun.rotation - Math.PI/2) * largoDelCañon;
    let muzzleY = playerGun.y + Math.sin(playerGun.rotation - Math.PI/2) * largoDelCañon;

    let bullet = this.add.rectangle(muzzleX, muzzleY, 8, 30, 0xffff00);
    bullets.add(bullet); 
    this.physics.add.existing(bullet);
    
    // Trayectoria balística
    let bulletAngle = Phaser.Math.Angle.Between(bullet.x, bullet.y, crosshair.x, crosshair.y);
    this.physics.velocityFromRotation(bulletAngle, BULLET_SPEED, bullet.body.velocity);
    bullet.rotation = bulletAngle + Math.PI/2;
}

/**
 * ============================================================
 * 9. GESTIÓN DE IMPACTOS Y PUNTUACIÓN
 * ============================================================
 */
function impactar(bullet, target) {
    bullet.destroy(); 
    target.setFrame(1); // Frame de impacto
    target.body.enable = false;
    this.tweens.killTweensOf(target);
    
    if(target.tipo === 'drone') {
        droneSound.play();
        score += 25;
    } else {
        dianaSound.play();
        score += 10;
    }
    
    scoreText.setText(`PUNTOS: ${score}`);
    this.time.delayedCall(400, () => { if(target.active) target.destroy(); });
}

/**
 * ============================================================
 * 10. FINAL DE JUEGO Y GUARDADO EN RANKING SEGURO
 * ============================================================
 */
async function finalizarMision(scene) {
    isGameOver = true;
    spawnEvent.remove();
    bgMusic.stop();
    
    // Ocultar controles
    joystickBase.setVisible(false); 
    joystickKnob.setVisible(false); 
    fireButton.setVisible(false); 
    fireText.setVisible(false);
    
    // Panel de resultados
    const pW = window.innerWidth * 0.75, pH = window.innerHeight * 0.75;
    const pX = (window.innerWidth - pW) / 2, pY = (window.innerHeight - pH) / 2;
    
    scene.add.graphics()
        .fillStyle(0x000, 0.95)
        .fillRoundedRect(pX, pY, pW, pH, 30)
        .setDepth(200);
    
    let info = scene.add.text(window.innerWidth/2, window.innerHeight/2, 'ENVIANDO INFORME...', {
        fontSize:'24px', fill:'#0f0'
    }).setOrigin(0.5).setDepth(201);

    try {
        // Escritura en Firebase (Protegida por tus nuevas reglas)
        const rankingRef = database.ref('ranking_mision1');
        await rankingRef.push().set({ nombre: userName, puntuacion: score });
        
        // Recuperación del TOP 5
        rankingRef.orderByChild('puntuacion').limitToLast(5).once('value', (snap) => {
            info.destroy();
            
            scene.add.text(window.innerWidth/2, pY + 60, 'TOP 5 AGENTES', {
                fontSize:'42px', fill:'#0f0', fontStyle:'bold'
            }).setOrigin(0.5).setDepth(201);
            
            let ranks = [];
            snap.forEach(c => { ranks.push(c.val()); });
            ranks.reverse().forEach((r, i) => {
                let isMe = (r.nombre === userName && r.puntuacion === score);
                scene.add.text(window.innerWidth/2, pY + 160 + (i * 55), 
                    `${i+1}. ${r.nombre.toUpperCase()} - ${r.puntuacion}`, 
                    { fontSize:'28px', fill: isMe ? '#0f0' : '#fff' }
                ).setOrigin(0.5).setDepth(201);
            });

            // Botón Reiniciar
            let btn = scene.add.rectangle(window.innerWidth/2, pY + pH - 80, 320, 90, 0x00ff00).setDepth(201).setInteractive();
            scene.add.text(window.innerWidth/2, pY + pH - 80, 'NUEVO INTENTO', {
                fontSize:'32px', fill:'#000', fontStyle:'bold'
            }).setOrigin(0.5).setDepth(202);
            
            btn.on('pointerdown', () => scene.scene.restart());
        });
    } catch (e) {
        info.setText("ERROR DE CONEXIÓN");
    }
}
</script>
</body>
</html>
